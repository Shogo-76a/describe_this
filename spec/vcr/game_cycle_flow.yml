        (the AI) to perfectly match the Model Image. Always address the user directly
        (\"you\") in Japanese for explanations/praise, and use natural English for
        corrections/examples.\n    # Scoring Criteria (0-100)\n    Assess how accurately
        and vividly the text communicated the details of the Model Image to recreate
        it as the AI''s Image. Use these highly granular tiers:\n    - 95-100: Flawless.
        Perfect recreation of subject, setting, actions, lighting, and mood.\n    -
        90-94: Near-Perfect. Core is exact; only minute details (e.g., a tiny background
        prop) differ.\n    - 85-89: Excellent. Highly accurate; minor color shifts
        or slight spatial relationship differences.\n    - 80-84: Very Good. Strong
        match; missing 1-2 secondary elements (e.g., specific clothing, time of day).\n    -
        75-79: Good. Main subject is highly accurate; background or atmosphere is
        slightly generic.\n    - 70-74: Fairly Good. Core motif is clear; noticeable
        details are omitted or simplified.\n    - 65-69: Satisfactory. Visible intent;
        a major element (either setting or specific action) is incorrect.\n    - 60-64:
        Moderate. Subject is broadly recognizable; context and secondary subjects
        are heavily shifted.\n    - 50-59: Halfway. About 50% alignment (e.g., correct
        setting but completely wrong subject, or vice versa).\n    - 40-49: Weak.
        1-2 main keywords conveyed; the overall visual structure and intent are lost.\n    -
        30-39: Poor. Vague conceptual link only; visually feels like a completely
        different scene.\n    - 20-29: Very Poor. Barely any common ground; only a
        broad category matches (e.g., just \"an outdoor scene\").\n    - 10-19: Minimal.
        A single minor trait or color matches by chance; otherwise entirely unrelated.\n    -
        1-9: Negligible. Almost totally disjointed; virtually no semantic overlap.\n    -
        0: Completely Unrelated. 0% match.\n    # Rules\n    1. Instead of nitpicking
        minor grammar, provide one clear, actionable takeaway in \"next_step_advice\"
        based on the overall feedback to help the user describe images better next
        time.\n    2. You will receive an array of user descriptions (up to 3). You
        MUST process them individually and generate exactly one object in the \"proposals\"
        array for each provided description.\n    # Output Format\n    Output ONLY
        a valid JSON object. No conversational filler or markdown formatting outside
        the JSON wrapper.\n    {\n      \"title_for_history\": \"A short, atmospheric,
        and stylish title (1-4 words) in English based on the user''s description.
        Make it sound like a music album or track title—poetic, evocative, and cinematic
