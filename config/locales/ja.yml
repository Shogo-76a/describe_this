  documents:
    privacy_policy:
      page_title: "プライバシーポリシー"
      intro: "「Describe This」（以下「本アプリ」）は、ユーザーの個人情報および入力データを適切に取り扱うため、以下のとおりプライバシーポリシーを定めます。"
      sections:
        section1:
          title: "1. 取得する情報"
          description: "本アプリでは、サービスの提供および改善のため、以下の情報を取得します。"
          items:
            account: "アカウント情報"
            account_desc: "ユーザー名、メールアドレス、パスワード等"
            user_input: "ユーザー入力データ"
            user_input_desc: "伝言ゲーム内で入力・送信された英文、翻訳テキスト、メッセージ内容等"
            learning_history: "学習履歴データ"
            learning_history_desc: "学習進捗、スコア、利用履歴等"
            technical_info: "技術的情報"
            technical_info_desc: "Cookie、IPアドレス、デバイス情報、アクセスログ等"
        section2:
          title: "2. 利用目的"
          description: "取得した情報は、以下の目的で利用します。"
          items:
            - "本アプリへの登録、本人確認および認証のため"
            - "伝言ゲーム機能および学習支援機能を提供するため"
            - "AIによる言語表現の添削・回答生成のため"
            - "アプリの改善、不具合対応、利用状況の分析のため"
            - "ユーザーへ重要なお知らせやサポート連絡を行うため"
            - "利用規約違反や不正利用の防止・対応のため"
        section3:
          title: "3. 外部サービスの利用（AIサービス等）"
          items:
            - "本アプリは、AIによる文章添削や言語学習機能の提供のため、外部のAIサービス（例: OpenAI, Inc. 等）のAPIを利用しています。"
            - "サービス提供に必要な範囲で、ユーザーが入力・送信したテキストデータの一部が上記外部サービスのサーバーへ送信されます。"
            - "送信されたデータはサービスの処理目的にのみ使用され、各外部サービス提供事業者の利用規約およびプライバシーポリシーに従って管理されます。"
        section4:
          title: "4. 第三者提供および外部委託"
          content: "法令に基づく場合を除き、ユーザーの同意なく個人情報を第三者に提供することはありません。ただし、アプリの運営およびサービス提供に必要な範囲（ホスティングサービス、AIサービス等）において、外部事業者へデータの取り扱いを委託する場合があります。"
        section5:
          title: "5. アクセス解析ツール"
          content: "本アプリでは、利用状況の分析およびサービス改善のため「Google Analytics」等のアクセス解析ツールを使用する場合があります。これらはCookieを使用して匿名のトラフィックデータを収集しており、個人を特定するものではありません。"
        section6:
          title: "6. 安全管理"
          content: "本アプリは、個人情報の漏えい、紛失、不正アクセス等を防ぐため、SSL/TLS暗号化通信の適用や適切なアクセス管理など、合理的な安全対策を講じます。"
        section7:
          title: "7. 個人情報の開示・訂正・削除"
          content: "ユーザーは、ご自身の登録情報について確認、修正、またはアカウント削除（データの消去）を求めることができます。ご希望の場合は、下記お問い合わせ窓口までご連絡ください。"
        section8:
          title: "8. プライバシーポリシーの変更"
          content: "本アプリは、法令の変更やサービス内容の見直しに伴い、本プライバシーポリシーを変更することがあります。変更後のポリシーは本アプリ上に掲載した時点で効力を生じるものとします。"
        section9:
          title: "9. お問い合わせ"
          description: "本プライバシーポリシーに関するお問い合わせやご相談は、以下の窓口までご連絡ください。"
          contact_label: "お問い合わせ先: %{email}"
      last_updated: "最終更新日：%{date}"
    terms:
      page_title: "利用規約"
      sections:
        section1:
          title: "1. 利用規約への同意"
          content: "「Describe This」（以下「本アプリ」）をご利用いただくことで、ユーザーは本利用規約およびプライバシーポリシーに同意したものとみなします。同意いただけない場合は、本アプリの利用をお控えください。"
        section2:
          title: "2. 機能および外部AIの利用について"
          items:
            - "本アプリは、伝言ゲーム形式を通じて言語学習を支援するサービスです。"
            - "本アプリでは、言語表現の添削や翻訳等の機能提供のため、外部のAI（人工知能）サービスを利用しています。"
            - "AIが生成・出力する内容は、必ずしも正確性、完全性、または有用性を保証するものではありません。ユーザーは自身の責任において内容をご確認ください。"
            - "外部AIサービスの障害や仕様変更、提供停止等に伴い、本アプリの機能の一部または全部が制限・停止される場合があり、これによって生じた損害について開発者は責任を負いかねます。"
        section3:
          title: "3. アカウント管理および責任"
          items:
            - "アカウント情報の管理はユーザーの責任において行うものとします。"
            - "アカウント情報の管理不足、パスワードの漏洩、または第三者による不正利用等によって生じたあらゆる損害について、開発者は一切の責任を負いかねます。"
            - "ユーザーが本アプリを通じて入力・送信したコンテンツ（文章や翻訳等）については、ユーザー自身がすべての責任を負うものとします。"
        section4:
          title: "4. 禁止事項"
          description: "本アプリの利用にあたり、以下の行為を禁止します。"
          items:
            - "法令または公序良俗に反する行為、または違法コンテンツの投稿"
            - "他のユーザーや第三者へのハラスメント、脅迫、迷惑行為"
            - "本アプリのセキュリティ機能の回避や不正な操作、運営を妨げる行為"
            - "他のユーザーの知的財産権等の権利を侵害する行為"
            - "その他、開発者が不適切と判断する行為"
        section5:
          title: "5. ユーザーコンテンツと知的財産権"
          items:
            - "本アプリに関するデザイン、テキスト、ロゴ等の権利は、開発者または正当な権利者に帰属します。"
            - "ユーザーが本アプリ内に投稿したコンテンツについて、開発者はサービスの提供、改善、または教育・PR目的の範囲内で無償で使用・複製・修正できるものとします。"
        section6:
          title: "6. 免責事項・アカウント停止"
          items:
            - "本アプリの利用によってユーザーに生じたあらゆる損害について、開発者に故意または重大な過失がある場合を除き、開発者は一切の責任を負いません。"
            - "ユーザーが本規約に違反した場合や不適切と判断された場合、開発者は事前通知なしにアカウントの停止または削除を行うことができるものとします。"
        section7:
          title: "7. サービスの変更・規約の変更"
          content: "開発者は、必要に応じてサービス内容や本利用規約を変更・停止することがあります。変更後の利用規約は、本アプリ上に掲載した時点で効力を生じるものとし、変更後も利用を継続した場合、変更後の規約に同意したものとみなします。"
        section8:
          title: "8. 準拠法および管轄裁判所"
          content: "本利用規約は日本法に基づいて解釈されます。本アプリに関して紛争が生じた場合は、開発者の所在地を管轄する裁判所を専属的合意管轄裁判所とします。"
      last_updated: "最終更新日：%{date}"

