    evidence_of_evaluation:
      labels:
        score: "スコア:"
        rationale: "根拠:"
      perfect:
        label: "Perfect（完璧）"
        score: "95〜100％"
        description_html: "主語、背景、アクション、光の加減、雰囲気に至るまで、すべての要素が相手（AI）に完璧に伝達された状態です。母語話者と同等以上の高い描写力・語彙力を発揮できた最高評価です。"
      amazing:
        label: "Amazing（素晴らしい）"
        score: "85〜94％"
        description_html: "伝達すべきコアも背景のディテールもほぼ一致しています。「湖の水色の濃さ」や「後部座席からの距離感」など、言語化が非常に難しい微細なニュアンスや色味のズレが少しあるだけで、イメージ共有の正確性は「驚くほど高い（Amazing）」と言える帯域です。"
      great:
        label: "Great（とても良い）"
        score: "75〜84％"
        description_html: "メインとなる被写体と状況は高度に正確に伝わっています。ただし、「早朝」という時間帯が抜けていたり、「きれいな」という雰囲気が一般的な背景として処理（省略）されたりしています。とはいえ、聞き手は十分すぎるほど鮮明なイメージを持てるため「Great」と称賛すべきレベルです。"
      good:
        label: "Good（良い）"
        score: "70〜74％"
        description_html: "目立つディテールの省略や文法の乱れはあるものの、「誰が・どこで・何をしている」という最も伝えたい本質（意図）は正しく相手に届いています。%{locale_in_game}学習の初期目標である「実生活で困らないイメージ共有」は完全にクリアできている状態です。"
      okay:
        label: "Okay（まあまあ・惜しい）"
        score: "50〜69％"
        description_html: "知っている単語を並べて意図は伝えようとしていますが、約半分しか伝わっていない状態です。例えば「カヌー」という単語は伝わっても、「女性が漕いでいる」というアクションが伝わらず無人のカヌーになってしまうなど、相手の脳内（AI画像）には明らかに異なる情景が生成されているため、日常生活でも「それってこういう事？」と聞き返されるレベルです。"
      needs_work:
        label: "Needs Work（もう一息・要改善）"
        score: "0〜49％"
        description_html: "1〜2個の単語しか拾われていないか、文法構造が破綻して全く違う情景として伝わってしまった状態です。イメージの共有には至っておらず、相手は「何を言っているのか分からない」状態であるため、基礎的な語彙や文法の見直し（Needs Work）が必要です。"
