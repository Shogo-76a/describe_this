  documents:
    privacy_policy:
      page_title: "Privacy Policy"
      intro: >
       "Describe This" (hereinafter referred to as "the App") establishes this Privacy Policy as follows to properly handle users' personal information and input data.
      sections:
        section1:
          title: "1. Information We Collect"
          description: "The App collects the following information to provide and improve our services:"
          items:
            account: "Account Information"
            account_desc: "Username, email address, password, etc."
            user_input: "User Input Data"
            user_input_desc: "English sentences, translated texts, message content, etc., entered and sent within the telephone game."
            learning_history: "Learning History Data"
            learning_history_desc: "Learning progress, scores, usage history, etc."
            technical_info: "Technical Information"
            technical_info_desc: "Cookies, IP address, device information, access logs, etc."
        section2:
          title: "2. Purpose of Use"
          description: "The collected information is used for the following purposes:"
          items:
            - "For user registration, identity verification, and authentication"
            - "To provide the telephone game and learning support features"
            - "For AI-based proofreading of English expressions and answer generation"
            - "To improve the app, address bugs, and analyze usage patterns"
            - "To deliver important notices and customer support to users"
            - "To prevent and address Terms of Service violations and fraudulent usage"
        section3:
          title: "3. Use of External Services (AI Services, etc.)"
          items:
            - "The App utilizes APIs from third-party AI services (e.g., OpenAI, Inc.) to provide sentence proofreading and English learning features."
            - "To the extent necessary for service provision, a portion of the text data entered and sent by users will be transmitted to the servers of these external services."
            - "Transmitted data is used solely for service processing purposes and is managed in accordance with the terms of service and privacy policies of each external service provider."
        section4:
          title: "4. Provision to Third Parties and Outsourcing"
          content: "Except as required by law, we will not provide personal information to third parties without the user's consent. However, we may outsource data handling to external service providers (e.g., hosting services, AI service providers) within the scope necessary to operate and provide the App."
        section5:
          title: "5. Access Analytics Tools"
          content: 'The App may use access analytics tools such as "Google Analytics" to analyze usage and improve our services. These tools use cookies to collect anonymous traffic data, which does not identify individual users.'
        section6:
          title: "6. Security Management"
          content: "To prevent the leakage, loss, or unauthorized access of personal information, the App implements reasonable security measures, including SSL/TLS encrypted communications and appropriate access management."
        section7:
          title: "7. Disclosure, Correction, and Deletion of Personal Information"
          content: "Users may request to review, correct, or delete their account (erase data). If you wish to do so, please contact us at the inquiry address below."
        section8:
          title: "8. Changes to the Privacy Policy"
          content: "The App may update this Privacy Policy in response to changes in laws or revisions to our services. The updated policy shall take effect as soon as it is posted on the App."
        section9:
          title: "9. Contact Us"
          description: "For questions or inquiries regarding this Privacy Policy, please contact us at:"
          contact_label: "Contact: %{email}"
      last_updated: "Last updated: %{date}"
    terms:
      page_title: "Terms of Service"
      sections:
        section1:
          title: "1. Agreement to Terms"
          content: >
            By using "Describe This" (hereinafter referred to as "the App"), users agree to be bound by these Terms of Service and our Privacy Policy. If you do not agree to these terms, please refrain from using the App.
        section2:
          title: "2. Features and Use of External AI Services"
          items:
            - "The App is a service designed to support English learning through a telephone game format."
            - "The App utilizes third-party AI (Artificial Intelligence) services to provide features such as English proofreading and translation."
            - "The accuracy, completeness, or usefulness of AI-generated content is not guaranteed. Users should verify all information at their own responsibility."
            - "In the event of service disruptions, specification changes, or suspension of third-party AI services, some or all functionality of the App may be limited or suspended. The developer assumes no liability for any damages resulting therefrom."
        section3:
          title: "3. Account Management and Responsibility"
          items:
            - "Users are responsible for managing their account credentials."
            - "The developer shall not be held liable for any damages arising from poor credential management, password leaks, or unauthorized access by third parties."
            - "Users bear full responsibility for all content (texts, translations, etc.) they input or transmit through the App."
        section4:
          title: "4. Prohibited Conduct"
          description: "When using the App, the following activities are strictly prohibited:"
          items:
            - "Actions that violate laws or public order and morals, or posting illegal content"
            - "Harassment, threats, or causing nuisance to other users or third parties"
            - "Bypassing security features, unauthorized manipulation, or interfering with operation of the App"
            - "Infringing upon the intellectual property or other rights of third parties"
            - "Any other conduct deemed inappropriate by the developer"
        section5:
          title: "5. User Content and Intellectual Property Rights"
          items:
            - "All rights to design, text, logos, and other assets related to the App belong to the developer or rightful owners."
            - "Regarding content posted by users within the App, the developer may use, reproduce, or modify it free of charge within the scope necessary for service provision, improvement, or educational/promotional purposes."
        section6:
          title: "6. Disclaimer and Account Suspension"
          items:
            - "The developer shall not be held liable for any damages incurred by users arising from the use of the App, except in cases of intentional misconduct or gross negligence by the developer."
            - "In the event of a violation of these Terms or inappropriate conduct, the developer reserves the right to suspend or delete the account without prior notice."
        section7:
          title: "7. Modifications to Service and Terms"
          content: >
            The developer may modify or suspend the service content or these Terms of Service at any time as needed. The modified Terms shall take effect as soon as they are posted on the App. Continued use of the App after changes constitutes acceptance of the modified Terms.
        section8:
          title: "8. Governing Law and Jurisdiction"
          content: >
            These Terms of Service shall be governed by and construed in accordance with the laws of Japan. Any disputes arising in connection with the App shall be subject to the exclusive jurisdiction of the court having jurisdiction over the location of the developer.
      last_updated: "Last updated: %{date}"

